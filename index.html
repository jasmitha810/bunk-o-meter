<!DOCTYPE html>
<html>
<head>
  <title>Attendance Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Bunk Checker</h1>
    <p>Find out how many classes you can safely skip!</p>

    <label>Classes you attended:</label>
    <input type="number" id="attended" placeholder="e.g. 45">

    <label>Total classes conducted:</label>
    <input type="number" id="total" placeholder="e.g. 50">

    <button id="calc-btn">Calculate</button>

    <h3 id="result"></h3>
  </div>

  <script src="script.js"></script>
</body>
</html>
